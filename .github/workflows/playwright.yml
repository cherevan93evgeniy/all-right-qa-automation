name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript, Chromium, and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        id: typecheck
        run: npm run typecheck

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium UI tests
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test tests/ui --project=chromium --workers=1 --reporter=list,html --trace=off

      - name: Run API tests
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: npx playwright test tests/api --project=api --workers=1 --reporter=./reporters/safe-summary.ts

      - name: Upload UI report
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload API summary
        if: ${{ !cancelled() && hashFiles('qa-summary.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: api-test-summary
          path: qa-summary.json
          retention-days: 7
